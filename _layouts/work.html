---
layout: default
---

<div class="work">

  <h1 class="page-heading">{{ page.title }}</h1>

  {{ content }}

  <ul class="work-list">
    {% for post in site.categories.work %}
      <li>
        <h2>
          <a class="work-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        </h2>
      </li>
    {% endfor %}
  </ul>

</div>

<header class="site-header">

  <div class="wrapper">

    <span class="site-title">{{ site.title }}</span>

    <nav class="site-nav">
      <a href="#" class="menu-icon">
        <svg viewBox="0 0 18 15">
          <path fill="#424242" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z"/>
          <path fill="#424242" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
          <path fill="#424242" d="M18,13.484C18,14.304,17.335,14.969,16.516,14.969H1.484C0.665,14.969,0,14.304,0,13.484l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12,18,12.665,18,13.484L18,13.484z"/>
        </svg>
      </a>

      <div class="trigger">
        {% for my_page in site.header.pages %}
          {% if my_page.slug %}
            <a class="page-link" href="{{ my_page.slug | prepend: site.baseurl }}">{{ my_page.name }}</a>
          {% else %}
            <a class="page-link" href="{{ my_page.name | downcase | prepend: '/' | prepend: site.baseurl }}">{{ my_page.name }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>

  </div>

</header>
